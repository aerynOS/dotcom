[default]
extend-ignore-re = [
    # Ignore blocks between `spellchecker:off` and `spellchecker:on`
    "spellchecker:off.*?\\n*.*spellchecker:on",
]

[default.extend-words]
aer = "aer"
indexs = "indexs"
ND = "ND"
Collet = "Collet"
rela = "rela"
ba = "ba"

[files]
extend-exclude = ["/package-lock.json"]
